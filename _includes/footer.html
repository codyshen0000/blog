<footer class="ds-footer">
  <div class="ds-wrap ds-footer-inner">
    <p>
      &copy; {{ 'now' | date: "%Y" }} {{ site.author }}
      · <a href="https://codyshen0000.github.io/">返回主页</a>
      {% if site.email %}
        · <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      {% endif %}
    </p>
    <p>
      基于 <a href="https://jekyllrb.com/" target="_blank" rel="noopener">Jekyll</a>
      · 托管于 <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a>
      {% if site.github_username %}
        · <a href="https://github.com/{{ site.github_username }}">GitHub</a>
      {% endif %}
      · <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </p>
  </div>
</footer>
