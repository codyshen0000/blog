<header class="site-header" id="nav">
  <div class="wrapper nav-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <nav class="site-nav" aria-label="站点">
      <input type="checkbox" id="nav-trigger" class="nav-trigger">
      <label for="nav-trigger">
        <span class="menu-icon" aria-hidden="true">
          <svg viewBox="0 0 18 15" width="18" height="15">
            <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.032C17.335,0,18,0.665,18,1.484L18,1.484z"/>
            <path d="M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0c0-0.82,0.665-1.484,1.484-1.484 h15.032C17.335,6.031,18,6.696,18,7.516L18,7.516z"/>
            <path d="M18,13.516C18,14.335,17.335,15,16.516,15H1.484C0.665,15,0,14.335,0,13.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.032C17.335,12.031,18,12.696,18,13.516L18,13.516z"/>
          </svg>
        </span>
        <span class="visually-hidden">菜单</span>
      </label>

      <div class="trigger">
        <a class="page-link home-link" href="{{ site.url }}/">个人主页</a>
        <span class="nav-sep" aria-hidden="true"></span>
        <a class="page-link{% if page.url == '/categories/' %} active{% endif %}" href="{{ '/categories/' | relative_url }}">分类</a>
        <a class="page-link{% if page.url == '/tags/' %} active{% endif %}" href="{{ '/tags/' | relative_url }}">标签</a>
        <a class="page-link{% if page.url == '/projects/' %} active{% endif %}" href="{{ '/projects/' | relative_url }}">项目</a>
        <a class="page-link{% if page.url == '/about/' %} active{% endif %}" href="{{ '/about/' | relative_url }}">关于</a>
      </div>
    </nav>

    <div class="tools">
      <button type="button" id="theme" aria-label="切换主题" title="切换主题">
        <span class="icon-moon">暗</span>
        <span class="icon-sun">亮</span>
      </button>
    </div>
  </div>
</header>
