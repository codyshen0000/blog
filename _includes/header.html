<header class="ds-nav" id="nav">
  <div class="ds-nav-inner">
    <a class="ds-nav-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <nav class="ds-nav-links" id="nav-links" aria-label="站点">
      <a href="https://codyshen0000.github.io/">个人主页</a>
      <span class="ds-nav-sep" aria-hidden="true"></span>
      <a{% if page.url == '/categories/' %} class="active"{% endif %} href="{{ '/categories/' | relative_url }}">分类</a>
      <a{% if page.url == '/tags/' %} class="active"{% endif %} href="{{ '/tags/' | relative_url }}">标签</a>
      <a{% if page.url == '/projects/' %} class="active"{% endif %} href="{{ '/projects/' | relative_url }}">项目</a>
      <a{% if page.url == '/about/' %} class="active"{% endif %} href="{{ '/about/' | relative_url }}">关于</a>
    </nav>

    <div class="ds-nav-tools">
      <button type="button" id="theme" aria-label="切换主题" title="切换主题">
        <svg class="blog-theme-moon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        <svg class="blog-theme-sun" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="ds-nav-menu" id="menu" type="button" aria-label="菜单" aria-expanded="false" aria-controls="nav-links">
        <span></span>
      </button>
    </div>
  </div>
</header>
